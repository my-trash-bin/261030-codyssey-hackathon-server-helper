services:
  access:
    build: .
    image: hackathon-access:latest
    container_name: hackathon-access
    env_file: .env
    cap_add:
      - NET_ADMIN            # VPN 라우팅/인터페이스 구성
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./transfer:/work/transfer   # 서버와 주고받을 파일 공유 폴더
      - ./known_hosts:/root/.ssh/known_hosts
      - vpnstate:/data/vpn          # VPN 프로필(.ovpn) 저장 — shutdown 후에도 유지
    stdin_open: true
    tty: true
    restart: "no"

volumes:
  vpnstate:                         # 'remove' 하면 이 볼륨(저장된 인증 정보)이 삭제됨
